<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventory Management Portal</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>📦</text></svg>">
</head>
<body>
<div id="login" class="login-wrap hidden">
  <form class="login-card" id="login-form">
    <div class="brand-big">📦 Inventory Portal</div>
    <p class="muted">Sign in to continue</p>
    <label>Username<input name="username" autocomplete="username" required autofocus></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn primary block" type="submit">Sign in</button>
    <div class="login-err" id="login-err"></div>
  </form>
</div>

<div id="shell" class="shell hidden">
  <aside class="sidebar">
    <div class="brand">📦 <span>Inventory Portal</span></div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div id="whoami"></div>
      <button class="btn ghost sm block" id="logout">Sign out</button>
    </div>
  </aside>
  <main>
    <header class="topbar">
      <button class="btn ghost sm only-mobile" id="menu-toggle">☰</button>
      <h1 id="page-title">Dashboard</h1>
      <div class="spacer"></div>
      <div id="topbar-actions"></div>
    </header>
    <section id="view" class="view"></section>
  </main>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="/js/core.js"></script>
<script src="/js/charts.js"></script>
<script src="/js/dashboard.js"></script>
<script src="/js/employees.js"></script>
<script src="/js/devices.js"></script>
<script src="/js/reports.js"></script>
<script src="/js/diagrams.js"></script>
<script src="/js/importer.js"></script>
<script src="/js/admin.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
